services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false # CI and fresh clones validate/boot without one
    environment:
      # Override localhost values from .env with in-network service names
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Drive the network-isolated browser container instead of a local Chromium
      BROWSER_WS_ENDPOINT: ws://browser:3333/${BROWSER_WS_TOKEN:-}
    networks: [backend, browser]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser:
        condition: service_started
    restart: unless-stopped

  # SSRF boundary: Chromium runs here, on a network without postgres/redis,
  # behind an egress firewall that rejects all private/reserved destinations
  # (see infra/browser/entrypoint.sh). Not published to the host.
  browser:
    build:
      context: infra/browser
    environment:
      BROWSER_WS_TOKEN: ${BROWSER_WS_TOKEN:-}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      # Space-separated IPv4:port exemptions, e.g. a proxy gateway on a private IP
      EGRESS_ALLOW: ${EGRESS_ALLOW:-}
    cap_add: [NET_ADMIN] # only used by entrypoint before dropping to pwuser
    shm_size: 1gb
    networks: [browser]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-nestjs_scraper}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Observability — opt-in: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    networks: [backend]
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [backend]
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  backend:
  browser:

volumes:
  postgres_data:
  redis_data:
